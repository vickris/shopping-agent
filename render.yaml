services:
  - type: web
    name: deal-agent-beta
    runtime: docker
    region: frankfurt
    # Paid compute: review the price in Render before creating the Blueprint.
    # Headless browsers need more memory than an Elixir-only app. Measure before scaling.
    plan: 2c-4g
    numInstances: 1
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: "off"
    healthCheckPath: /health
    preDeployCommand: /app/bin/migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: deal-agent-beta-db
          property: connectionString
      # Supply at least 64 bytes; generate locally with mix phx.gen.secret.
      - key: SECRET_KEY_BASE
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4.1-mini
      - key: REMOTE_CHECKOUT_ENABLED
        value: "true"
      - key: LOCAL_BROWSER_ENABLED
        value: "false"
      - key: MAX_BROWSER_SESSIONS
        value: "8"
      - key: POOL_SIZE
        value: "5"
      - key: PORT
        value: "4000"
      - key: ERL_FLAGS
        value: "+S 2:2"

databases:
  - name: deal-agent-beta-db
    region: frankfurt
    # Smallest paid database; storage is billed separately.
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: deal_agent
    user: deal_agent
    ipAllowList: []
